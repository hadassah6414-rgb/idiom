<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영숙어 시험</title>
<style>
  :root{
    --bg:#FFF9E6; --card:#FFFFFF; --yellow:#FFC93C; --yellow-deep:#F5A614;
    --yellow-soft:#FFF3C7; --ink:#332B1A; --ink-soft:#8A7B5C; --line:#F0E3B8;
    --green:#2E8B57; --green-bg:#EAF6EF; --red:#C0392B; --red-bg:#FBEDEA;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;align-items:center;
    padding:56px 16px 56px;
  }
  header{text-align:center;margin-bottom:22px;max-width:640px;width:100%;}
  .book-tag{display:inline-block;background:var(--yellow);color:var(--ink);
    font-size:12px;font-weight:700;letter-spacing:.12em;
    padding:5px 14px;border-radius:999px;margin-bottom:10px;}
  h1{font-size:clamp(20px,4.5vw,28px);font-weight:800;line-height:1.35;}
  h1 .hl{background:linear-gradient(transparent 62%, var(--yellow) 62%);padding:0 2px;}

  /* ===== 탭 ===== */
  .tabs{display:flex;gap:8px;background:#FFF;border:1.5px solid var(--line);
    border-radius:999px;padding:6px;margin:22px auto 28px;width:fit-content;}
  .tabs button{border:none;background:transparent;font:inherit;font-weight:700;
    font-size:14px;color:var(--ink-soft);padding:9px 18px;border-radius:999px;
    cursor:pointer;transition:.2s;}
  .tabs button.active{background:var(--yellow);color:var(--ink);}
  .tabs button:focus-visible{outline:3px solid var(--yellow-deep);outline-offset:2px;}

  /* ===== 선택 화면 ===== */
  .select-wrap{max-width:560px;width:100%;}
  .unit-list{display:grid;gap:0 30px;grid-template-columns:1fr 1fr;}
  .unit{font:inherit;font-size:17px;font-weight:700;color:var(--ink);
    text-align:left;cursor:pointer;background:none;border:none;
    border-bottom:1px solid var(--line);padding:14px 2px;transition:.15s;
    display:flex;align-items:baseline;gap:9px;}
  .unit .no{flex:none;font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--yellow-deep);}
  .unit .name{word-break:break-word;}
  .unit .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .unit:hover{color:var(--yellow-deep);padding-left:8px;}
  .unit:focus-visible{outline:2px solid var(--yellow-deep);outline-offset:2px;border-radius:6px;}
  .unit.empty{color:var(--ink-soft);opacity:.4;cursor:not-allowed;}
  .unit.empty .no,.unit.empty .cnt{color:var(--ink-soft);}
  .unit.empty:hover{padding-left:2px;color:var(--ink-soft);}
  .unit.big{grid-column:1 / -1;background:var(--yellow-soft);border-radius:12px;
    border-bottom:1px solid var(--yellow);margin:8px 0;padding:14px 16px;}
  .unit.big .no{color:var(--ink);}
  .unit.big.empty{background:#FBF7E8;}

  /* ===== 시험 화면 ===== */
  #screen-test,#screen-result{width:100%;max-width:560px;}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back-btn{flex:none;width:32px;height:32px;padding:0;border:none;background:none;
    color:var(--ink);font-size:24px;font-weight:800;line-height:1;cursor:pointer;transition:.15s;}
  .back-btn:hover{color:var(--yellow-deep);transform:translateX(-3px);}
  .back-btn:focus-visible{outline:2px solid var(--yellow-deep);outline-offset:4px;border-radius:8px;}
  .head-title{font-size:17px;font-weight:800;line-height:1.3;}
  .head-title span{display:block;font-size:12px;font-weight:700;
    letter-spacing:.1em;color:var(--yellow-deep);margin-bottom:2px;}

  .status{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .progress{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .lives{display:flex;gap:6px;align-items:center;}
  .lives .pip{width:13px;height:13px;border-radius:50%;background:var(--yellow-deep);transition:.2s;}
  .lives .pip.lost{background:var(--line);}
  .lives .txt{font-size:13px;font-weight:700;color:var(--yellow-deep);}

  .qbox{background:var(--card);border:1.5px solid var(--line);
    border-bottom:6px solid var(--yellow);border-radius:22px;
    padding:34px 26px;text-align:center;box-shadow:0 10px 24px rgba(180,140,30,.10);
    margin-bottom:18px;}
  .qbox .label{font-size:12px;font-weight:800;letter-spacing:.12em;
    color:var(--yellow-deep);margin-bottom:12px;}
  .qbox .main{font-size:clamp(20px,4.6vw,30px);font-weight:800;line-height:1.45;word-break:keep-all;}
  .qbox .trait{display:inline-block;vertical-align:middle;margin-left:8px;
    background:var(--yellow-soft);color:var(--ink);border:1.5px solid var(--yellow);
    border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;}

  .ex{margin:0 0 16px;padding:14px 16px;background:var(--yellow-soft);
    border:1px solid var(--line);border-radius:14px;
    font-size:14px;line-height:1.7;color:var(--ink);text-align:left;word-break:keep-all;}
  .ex .ex-line + .ex-line{margin-top:9px;}
  .ex .tag{display:inline-block;font-size:11px;font-weight:800;color:var(--yellow-deep);
    background:#fff;border-radius:999px;padding:3px 10px;margin-right:8px;}

  .ans{width:100%;padding:17px 16px;font:inherit;font-size:19px;font-weight:600;
    text-align:center;border:2px solid var(--line);border-radius:14px;
    outline:none;transition:.2s;background:#fff;color:var(--ink);}
  .ans:focus{border-color:var(--yellow);}
  .ans.ok{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:800;}
  .ans.no{border-color:var(--red);background:var(--red-bg);color:var(--red);font-weight:800;}
  .fb{min-height:24px;margin-top:11px;font-size:14px;font-weight:700;
    color:var(--ink-soft);line-height:1.6;text-align:center;word-break:keep-all;}
  .fb.good{color:var(--green);}
  .fb.bad{color:var(--red);}
  .fb del{opacity:.7;}

  /* ===== 결과 ===== */
  .result{background:var(--card);border:1.5px solid var(--line);
    border-bottom:6px solid var(--yellow);border-radius:22px;
    padding:34px 26px;text-align:center;box-shadow:0 10px 24px rgba(180,140,30,.10);}
  .result h2{font-size:22px;font-weight:800;margin-bottom:8px;}
  .result .score{font-size:34px;font-weight:800;color:var(--yellow-deep);margin:12px 0 6px;}
  .result p{color:var(--ink-soft);font-size:14px;line-height:1.7;}
  .note-title{margin:20px 0 8px;text-align:left;font-size:14px;font-weight:800;color:var(--red);}
  .note-wrap{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;text-align:left;}
  th{background:var(--yellow);color:var(--ink);padding:9px 12px;font-weight:800;position:sticky;top:0;}
  td{padding:9px 12px;border-bottom:1px solid var(--line);line-height:1.6;word-break:keep-all;}
  td.ans-col{font-weight:800;color:var(--yellow-deep);}
  td small{color:var(--ink-soft);}

  .btn{font:inherit;font-weight:700;font-size:15px;border-radius:14px;
    padding:13px 20px;cursor:pointer;border:1.5px solid var(--line);
    background:#FFF;color:var(--ink);transition:.15s;width:100%;}
  .btn:hover{transform:translateY(-1px);}
  .btn:focus-visible{outline:3px solid var(--yellow-deep);outline-offset:2px;}
  .btn.primary{background:var(--yellow);border-color:var(--yellow);}
  .btn.ghost{color:var(--ink-soft);}
  .btns{display:flex;flex-direction:column;gap:9px;margin-top:18px;}
  .hidden{display:none !important;}
  footer{margin-top:26px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.8;}
</style>
</head>
<body>

<header>
  <div class="book-tag">IDIOM TEST</div>
  <h1>영숙어 <span class="hl">시험</span></h1>
</header>

<!-- ============ 화면 1 : 선택 ============ -->
<section id="screen-select" class="select-wrap">
  <nav class="tabs" id="chapter-tabs" aria-label="장 선택">
    <button data-ch="0" class="active">1장</button>
    <button data-ch="1">2장</button>
  </nav>
  <div class="unit-list" id="unit-list"></div>
</section>

<!-- ============ 화면 2 : 시험 ============ -->
<section id="screen-test" class="hidden">
  <div class="head">
    <button class="back-btn" id="btn-back" aria-label="선택 화면으로 돌아가기">←</button>
    <div class="head-title"><span id="t-chapter"></span><div id="t-unit"></div></div>
  </div>
  <div class="status">
    <div class="progress" id="t-progress"></div>
    <div class="lives" id="t-lives"></div>
  </div>
  <div class="qbox">
    <div class="label" id="q-label"></div>
    <div class="main" id="q-main"></div>
  </div>
  <div class="ex hidden" id="q-ex"></div>
  <input class="ans" id="ans" type="text" autocomplete="off" spellcheck="false"
         placeholder="정답 입력 후 Enter">
  <div class="fb" id="fb"></div>
</section>

<!-- ============ 화면 3 : 결과 ============ -->
<section id="screen-result" class="hidden">
  <div class="head">
    <button class="back-btn" id="btn-back2" aria-label="선택 화면으로 돌아가기">←</button>
    <div class="head-title"><span id="r-chapter"></span><div id="r-unit"></div></div>
  </div>
  <div class="result" id="result-box"></div>
</section>

<footer>
  뜻 문제는 여러 뜻 중 하나만 적어도 정답입니다 · 스펠링 문제는 ~ 표시를 붙이지 않아도 정답입니다
</footer>

<script>
const BOOK = [
{
  chapter: "1장",
  units: [

    { no:"01", title:"away", cards:[
      { idiom:"go away",        meaning:"떠나다, 나가다",            example:"'분리' / We'll go away for the weekend." },
      { idiom:"drive away",     meaning:"차로 떠나다",        example:"'분리' / I heard a car drive away." },
      { idiom:"laugh away/off", meaning:"웃어넘기다",                  example:"'분리' / He laughed away his worries." },
      { idiom:"melt away",      meaning:"녹다, 녹아서 점차 없어지다, (군중이) 서서히 물러가다", example:"'서서히' / The snowman melted away." },
      { idiom:"die away",       meaning:"(소리·바람·빛 등이) 점점 잦아들다",  example:"'서서히' / The noise of the car died away." },
      { idiom:"fade away",      meaning:"(기억· 감정·소리·빛 등이) 서서히 사라져 가다, 시들다",           example:"'서서히' / This flower will soon fade away." },
      { idiom:"boil away",      meaning:"(액체·음식이) 계속 끓는다, 증발하다",             example:"'연속 동작' / The water in the kettle is boiling away." },
      { idiom:"work away",      meaning:"부지런히 일하다",        example:"'연속 동작' / He is working away in the fields." },

    { no:"02", title:"off", cards:[
      { idiom:"fall off(~)",     meaning:"(~에서) 떨어지다, 저하하다, 쇠약해지다", example:"'분리' / The jockey fell off the horse." },
      { idiom:"show off~",       meaning:"~을 과시하다", example:"'분리' / He's always showing off his watch." },

    ]},

    { no:"03", title:"up", cards:[
      { idiom:"dig up~",             meaning:"~을 파내다, ~을 발굴하다", example:"'상승' / Can you dig up this plant?" },
      { idiom:"gather up~",          meaning:"~을 주워 모으다", example:"'상승' / Gather up your toys." },

      { idiom:"use up ~",            meaning:"~을 탕진하다", example:"'완료' / He used up all the money in one day." },
      { idiom:"eat up (~)",          meaning:"(~을) 먹어 치우다, 음식을 남기지 않고 먹다", example:"'완료' / Eat up your fish." },
      { idiom:"drink up (~)",        meaning:"(~을) 다 마시다", example:"'완료' / Drink up your orange juice." },

      { idiom:"line up (~)",         meaning:"정렬하다, ~을 정렬시키다", example:"'완료' / Please line up in two rows." },
      { idiom:"lock up ~",           meaning:"~에 자물쇠를 잠그다, ~을 가두다", example:"'완료' / Don't forget to lock up the house." },
      { idiom:"shut up ~",           meaning:"~을 닫다, 입 다물게 하다", example:"'완료' / Shut up!" },

// ===== 공통 =====
function shuffle(a){
  a = [...a];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function filled(unit){
  return unit.cards.filter(c => c.idiom.trim() && c.meaning.trim());
}
function rangeCards(chapter, from, to){
  const out = [];
  chapter.units.forEach(u => {
    const n = parseInt(u.no, 10);
    if(n >= from && n <= to) filled(u).forEach(c => out.push(c));
  });
  return out;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* =========================================================
   정답 판정
   ========================================================= */
// --- 영어 스펠링 ---
function normEn(s){
  return String(s).toLowerCase()
    .replace(/[~()\[\].,!?'"\/\-]/g," ")
    .replace(/\s+/g," ").trim();
}
// laugh away/off → laugh away, laugh off   /   shut/close down~ → shut down, close down
function enForms(idiom){
  let outs = [""];
  idiom.split(/\s+/).forEach(tok => {
    const opts = tok.includes("/") ? tok.split("/") : [tok];
    const next = [];
    outs.forEach(base => opts.forEach(o => next.push((base + " " + o).trim())));
    outs = next;
  });
  const set = new Set(outs.map(normEn).filter(Boolean));
  set.add(normEn(idiom));   // 책에 적힌 그대로 쓴 경우 (shut/close down~)
  set.delete("");
  return set;
}
function checkEn(input, idiom){
  return enForms(idiom).has(normEn(input));
}

// --- 한국어 뜻 ---
function normKo(s){
  return String(s).replace(/\s+/g,"").replace(/[~()·.,'"·]/g,"");
}
// 앞머리의 '~을', '~에게' 같은 덩어리와, 괄호를 뗀 뒤 남는 조사를 떼어 낸다
function stripLead(x){
  const s = String(x).trim();
  if(s.startsWith("~")){                 // '~에게 데이트 신청하다' → '데이트 신청하다'
    const i = s.indexOf(" ");
    return i > -1 ? s.slice(i + 1).trim() : s.replace(/^~\s*/, "").trim();
  }
  // '(타이어·풍선)' 을 뗀 뒤 남는 '을 부풀리다' → '부풀리다'
  // 조사 뒤에 반드시 공백이 있을 때만 떼므로 '이르는 말' 같은 뜻은 건드리지 않는다
  const m = s.match(/^(에게서|에게|에서|한테|으로|을|를|이|가|에|의|로|와|과)\s+/);
  return m ? s.slice(m[0].length).trim() : s;
}
// 한 조각에 대해 허용되는 여러 형태
function koForms(piece){
  const bases = [piece, piece.replace(/\([^)]*\)/g," ")];   // 괄호 안 내용 있음/없음
  const out = [];
  bases.forEach(x => { out.push(x); out.push(stripLead(x)); });
  return out.map(normKo).filter(Boolean);
}
function koAnswerSet(meaning){
  const set = new Set();
  meaning.split(",").forEach(p => koForms(p).forEach(f => set.add(f)));
  koForms(meaning).forEach(f => set.add(f));   // 전체를 통째로 적은 경우
  set.add(normKo(meaning));
  set.add(normKo(meaning.replace(/\([^)]*\)/g,"")));
  return set;
}
// 뜻이 " / " 로 나뉘어 있으면 '갈래'가 여럿인 숙어
function meaningGroups(meaning){
  return String(meaning).split(" / ").map(g => g.trim()).filter(Boolean);
}
// 갈래가 하나면: 하나만 적어도, 전부 적어도 정답
// 갈래가 여럿이면: 각 갈래에서 최소 하나씩 적어야 정답
function checkKo(input, meaning){
  const groups = meaningGroups(meaning);
  const parts = input.split(/[,\/]/).map(normKo).filter(Boolean);

  if(groups.length < 2){
    const ok = koAnswerSet(meaning);
    if(ok.has(normKo(input))) return true;
    return parts.length > 0 && parts.every(p => ok.has(p));
  }

  const sets = groups.map(koAnswerSet);
  if(!parts.length) return false;
  if(!parts.every(p => sets.some(st => st.has(p)))) return false;   // 엉뚱한 답 섞이면 오답
  return sets.every(st => parts.some(p => st.has(p)));              // 모든 갈래를 채워야 정답
}

function renderList(){

                + '<span class="name">' + esc(unit.title || "텍스트") + '</span>'

    if(n === 0) b.disabled = true;
    else b.onclick = () => startTest(
      filled(unit),

      unit.title || "텍스트"

      const t = document.createElement("button");
      t.className = "unit big" + (pool.length === 0 ? " empty" : "");
      t.innerHTML = '<span class="no">' + sp.id + '</span>'

                                  : '<span class="cnt">준비 중</span>');
      if(pool.length === 0) t.disabled = true;

        pool,

      );
      list.appendChild(t);
    });

   화면 2 : 시험
   ========================================================= */
// 뜻/스펠링을 반반으로 만든 뒤 섞는다 (한쪽으로 치우치지 않게)
function isAlternating(a){
  if(a.length < 4) return false;
  for(let i=1;i<a.length;i++) if(a[i] === a[i-1]) return false;
  return true;   // 처음부터 끝까지 번갈아 나오는 배열
}
function makeTypes(n){
  const half = Math.floor(n/2);
  let arr = [];
  for(let i=0;i<n;i++) arr.push(i < half ? "meaning" : "spelling");
  for(let k=0;k<8;k++){                 // 번갈아 배열이면 다시 섞는다
    arr = shuffle(arr);
    if(!isAlternating(arr)) break;
  }
  return arr;
}

// 숙어 하나당 문제 하나, 뜻/스펠링은 무작위
function makeQueue(cards){
  const list = shuffle(cards);
  const types = makeTypes(list.length);
  return list.map((c, i) => ({ card: c, type: types[i] }));
}

// 예문 앞의 분류표만 뽑아낸다 ('상승·기세' 등)
function traitOf(card){
  const raw = (card.example || "").trim();
  const i = raw.indexOf(" / ");
  return i > -1 ? raw.slice(0, i).trim() : "";
}
// 같은 철자에 뜻이 여러 개인 숙어를 찾아 둔다
let dupIdiom = {}, dupMeaning = {};
function markDuplicates(cards){
  dupIdiom = {}; dupMeaning = {};
  cards.forEach(c => {
    dupIdiom[c.idiom]   = (dupIdiom[c.idiom]   || 0) + 1;
    dupMeaning[c.meaning] = (dupMeaning[c.meaning] || 0) + 1;
  });
}

// pool = 이 시험이 다루는 범위 전체, pick = 그중 무작위로 뽑을 문제 수(없으면 전부)
function startTest(pool, chLabel, unitLabel, maxLives, pick){
  curMax = maxLives || MAX_LIVES;
  curSource = { pool, pick, chLabel, unitLabel, maxLives: curMax };
  curTitle = { ch: chLabel, unit: unitLabel };
  markDuplicates(pool);          // 뽑힌 문제가 아니라 '범위 전체'를 기준으로 중복을 본다
  const cards = pick ? shuffle(pool).slice(0, pick) : pool;
  queue = makeQueue(cards);
  pos = 0; lives = curMax; score = 0; wrong = [];
  phase = "main"; checked = false; copyMode = false;
  $("t-chapter").textContent = chLabel;
  $("t-unit").textContent = unitLabel;
  show("screen-test");
  renderQ();
}

function startReview(){
  queue = shuffle(wrong.map(q => ({ card:q.card, type:q.type })));
  wrong = [];
  pos = 0; score = 0;
  phase = "review"; checked = false; copyMode = false;
  $("t-chapter").textContent = curTitle.ch;
  $("t-unit").textContent = "오답 퀴즈";
  show("screen-test");
  renderQ();
}

function drawLives(){
  const el = $("t-lives");
  if(phase === "review"){ el.innerHTML = '<span class="txt">복습 중 · 목숨 없음</span>'; return; }
  let s = "";
  for(let i=0;i<curMax;i++) s += '<span class="pip' + (i < lives ? "" : " lost") + '"></span>';
  el.innerHTML = s;
}

function renderQ(){
  const q = queue[pos];
  checked = false; copyMode = false;
  $("t-progress").textContent = (phase === "review" ? "오답 " : "문제 ")
    + (pos + 1) + " / " + queue.length;
  drawLives();
  // 같은 철자(또는 같은 뜻)가 둘 이상일 때만 분류표를 붙여 구분해 준다
  const ambiguous = q.type === "meaning"
    ? dupIdiom[q.card.idiom] > 1
    : dupMeaning[q.card.meaning] > 1;
  const trait = ambiguous ? traitOf(q.card) : "";
  const chip = trait ? ' <span class="trait">' + esc(trait) + '</span>' : "";

  if(q.type === "meaning"){
    const g = meaningGroups(q.card.meaning).length;
    $("q-label").textContent = g > 1
      ? "이 숙어의 뜻은? (뜻이 " + g + "갈래 — 갈래마다 하나씩, 쉼표로 구분)"
      : "이 숙어의 뜻은?";
    $("q-main").innerHTML = esc(q.card.idiom) + chip;
    $("ans").placeholder = "뜻 입력 후 Enter";
  }else{
    $("q-label").textContent = "이 뜻에 맞는 숙어는?";
    $("q-main").innerHTML = esc(q.card.meaning) + chip;
    $("ans").placeholder = "영어 숙어 입력 후 Enter";
  }
  const a = $("ans");
  a.value = ""; a.className = "ans"; a.readOnly = false;
  $("q-ex").className = "ex hidden"; $("q-ex").innerHTML = "";
  $("fb").textContent = ""; $("fb").className = "fb";
  a.focus();
}


// 오답일 때 문제 아래에 예문을 띄운다
function exampleList(card){
  const arr = Array.isArray(card.example) ? card.example : [card.example];
  return arr.map(t => String(t || "").trim()).filter(t => t && t !== "텍스트");
}
function showExample(q){
  const list = exampleList(q.card);
  if(!list.length) return;
  const box = $("q-ex");
  box.innerHTML = list.map(raw => {
    const i = raw.indexOf(" / ");
    return i > -1
      ? '<div class="ex-line"><span class="tag">' + esc(raw.slice(0, i)) + '</span>' + esc(raw.slice(i + 3)) + '</div>'
      : '<div class="ex-line">' + esc(raw) + '</div>';
  }).join("");
  box.className = "ex";
}

function answerOf(q){ return q.type === "meaning" ? q.card.meaning : q.card.idiom; }

// 맞혔을 때, 내가 쓴 것 말고 나머지 정답까지 보여 준다
function otherAnswerHTML(q, val){
  const full = answerOf(q);
  if(val.trim() === full.trim()) return "";          // 똑같이 다 썼으면 생략
  const label = q.type === "meaning" ? "전체 뜻" : "책 표기";
  return '<br>' + label + ': <b>' + esc(full) + '</b>';
}

function grade(){
  const q = queue[pos];
  const a = $("ans"), fb = $("fb");
  const val = a.value.trim();
  if(!val){ fb.className = "fb bad"; fb.textContent = "답을 입력해 주세요."; return; }

  const correct = q.type === "meaning"
    ? checkKo(val, q.card.meaning)
    : checkEn(val, q.card.idiom);

  if(correct){
    score++;
    checked = true; pos++;
    a.readOnly = true; a.className = "ans ok";
    showExample(q);
    fb.className = "fb good";
    fb.innerHTML = "정답입니다! Enter로 다음" + otherAnswerHTML(q, val);
    a.focus();
    return;
  }

  if(phase === "main"){
    lives--; drawLives();
    wrong.push(q);
    checked = true; pos++;
    a.readOnly = true; a.className = "ans no";
    a.value = answerOf(q);
    showExample(q);
    fb.className = "fb bad";
    fb.innerHTML = "내가 쓴 답: <del>" + esc(val) + "</del> · "
      + (lives <= 0 ? "목숨 소진! Enter로 결과 보기" : "Enter로 다음");
    a.focus();
  }else{
    // 오답 퀴즈에서 또 틀림 → 따라 쓰기
    copyMode = true;
    a.className = "ans no"; a.value = "";
    a.placeholder = "정답을 그대로 입력 후 Enter";
    showExample(q);
    fb.className = "fb bad";
    fb.innerHTML = "또 틀렸습니다. 정답 [ <b>" + esc(answerOf(q)) + "</b> ] 을(를) 그대로 따라 쓰세요.";
    a.focus();
  }
}

function gradeCopy(){
  const q = queue[pos];
  const a = $("ans"), fb = $("fb");
  const val = a.value.trim();
  if(!val) return;
  const target = answerOf(q);
  const same = q.type === "meaning"
    ? normKo(val) === normKo(target)
    : normEn(val) === normEn(target);
  if(same){
    copyMode = false; checked = true; pos++;
    a.readOnly = true; a.className = "ans ok";
    fb.className = "fb good";
    fb.textContent = "잘 따라 쓰셨습니다! Enter로 다음";
  }else{
    a.value = "";
    fb.className = "fb bad";
    fb.innerHTML = "글자가 다릅니다. [ <b>" + esc(target) + "</b> ] 을(를) 다시 그대로 적어 주세요.";
  }
  a.focus();
}

function next(){
  if(phase === "main" && lives <= 0){ showResult(false); return; }
  if(pos >= queue.length){ phase === "review" ? showReviewDone() : showResult(true); return; }
  renderQ();
}

$("ans").addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(copyMode) gradeCopy();
  else if(!checked) grade();
  else next();
});
// 채점이 끝난 상태에서 입력칸을 누르면 다음으로
$("ans").addEventListener("click", () => {
  if(checked && !copyMode) next();
});

// 입력칸 밖으로 초점이 나가 있어도 Enter 로 넘어갈 수 있게
document.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if($("screen-test").classList.contains("hidden")) return;
  if(document.activeElement === $("ans")) return;   // 입력칸 핸들러가 처리
  if(checked && !copyMode) next();
});

/* =========================================================
   화면 3 : 결과
   ========================================================= */
function noteHTML(){
  if(!wrong.length) return '<p style="color:var(--green);font-weight:700;margin-top:18px;">틀린 문제가 하나도 없습니다!</p>';
  let h = '<div class="note-title">오답 노트 (' + wrong.length + '개)</div>'
        + '<div class="note-wrap"><table><thead><tr>'
        + '<th style="width:58%">문제</th><th style="width:42%">정답</th>'
        + '</tr></thead><tbody>';
  wrong.forEach(q => {
    const asked = q.type === "meaning" ? q.card.idiom : q.card.meaning;
    const kind  = q.type === "meaning" ? "뜻" : "스펠링";
    h += '<tr><td>' + esc(asked) + ' <small>(' + kind + ')</small></td>'
       + '<td class="ans-col">' + esc(answerOf(q)) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function showResult(cleared){
  $("r-chapter").textContent = curTitle.ch;
  $("r-unit").textContent = curTitle.unit;
  const solved = pos;
  $("result-box").innerHTML =
    '<h2 style="color:' + (cleared ? "var(--ink)" : "var(--red)") + '">'
      + (cleared ? "시험 완료!" : "GAME OVER") + '</h2>'
    + '<div class="score">' + score + ' / ' + (cleared ? queue.length : solved) + '</div>'
    + '<p>' + (cleared
        ? "남은 목숨 " + lives + "개 · 전체 " + queue.length + "문제"
        : "목숨을 모두 잃었습니다 · " + solved + "문제까지 진행") + '</p>'
    + noteHTML()
    + '<div class="btns">'
      + (wrong.length ? '<button class="btn primary" id="b-review">틀린 문제만 다시 풀기 (' + wrong.length + '개)</button>' : "")
      + '<button class="btn" id="b-retry">처음부터 다시 시험</button>'
      + '<button class="btn ghost" id="b-home">묶음 선택으로</button>'
    + '</div>';
  show("screen-result");
  if($("b-review")) $("b-review").onclick = startReview;
  $("b-retry").onclick = () => startTest(curSource.pool, curSource.chLabel, curSource.unitLabel, curSource.maxLives, curSource.pick);
  $("b-home").onclick = backToSelect;
}

function showReviewDone(){
  $("r-chapter").textContent = curTitle.ch;
  $("r-unit").textContent = "오답 퀴즈";
  $("result-box").innerHTML =
    '<h2 style="color:var(--green)">오답 복습 완료!</h2>'
    + '<div class="score">' + score + ' / ' + queue.length + '</div>'
    + '<p>틀렸던 문제를 모두 확인했습니다.</p>'
    + '<div class="btns">'
      + '<button class="btn primary" id="b-retry">처음부터 다시 시험</button>'
      + '<button class="btn ghost" id="b-home">묶음 선택으로</button>'
    + '</div>';
  show("screen-result");
  $("b-retry").onclick = () => startTest(curSource.pool, curSource.chLabel, curSource.unitLabel, curSource.maxLives, curSource.pick);
  $("b-home").onclick = backToSelect;
}

// Esc 로도 선택 화면으로
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("screen-select").classList.contains("hidden")) backToSelect();
});

renderList();
</script>
